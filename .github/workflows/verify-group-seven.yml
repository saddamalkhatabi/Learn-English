name: Verify seventh English feelings-opinions group
on:
  push:
    branches: [main]
    paths: ["group-seven.js", "data/group-seven.json", "data/group-seven-audio-index.json", "scripts/test_group_seven.py", "index.html", "app.js", "styles.css", ".github/workflows/verify-group-seven.yml"]
  pull_request:
    paths: ["group-seven.js", "data/group-seven.json", "data/group-seven-audio-index.json", "scripts/test_group_seven.py", "index.html", "app.js", "styles.css", ".github/workflows/verify-group-seven.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax and source validation
        run: |
          set -o pipefail
          npm run check
          node --check group-seven.js
          python scripts/test_group_seven.py 2>&1 | tee /tmp/g7-verify.log
      - name: Confirm group navigator is integrated and no shared API was replaced
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const app=fs.readFileSync('app.js','utf8'),html=fs.readFileSync('index.html','utf8');
          assert.match(app,/GROUP_SEVEN\?\.open/);
          assert.match(app,/GROUP_SEVEN\?\.stop/);
          assert.match(html,/data-view="group-seven"/);
          assert.match(html,/id="g7ChapterTabs"/);
          assert.match(html,/data-view="group-one"/);
          assert.match(html,/src="group-seven\.js"/);
          assert.match(html,/data-view="paths"/);
          assert.match(html,/data-view="learn"/);
          console.log("Navigation integration OK");
          JS

      - name: Summarize Group Seven verification
        run: |
          echo "✅ Group Seven curriculum, source links and JavaScript checks passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Use the voice workflow's mandatory media verification for finished MP3 coverage." >> "$GITHUB_STEP_SUMMARY"
