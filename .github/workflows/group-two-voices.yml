name: Produce complete Group Two voice library with real word boundaries
on:
  push:
    branches: [main]
    paths:
      - data/group-two.json
      - scripts/render_group_two_audio.py
      - .github/workflows/group-two-voices.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-group-two-voice-main
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech and duration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'edge-tts>=7,<8'
      - name: Record each new narration, scene, story and dialogue
        run: python scripts/render_group_two_audio.py --concurrency 3 --retries 4
      - name: Validate clips, originals, images and same-recording word cues
        run: python scripts/test_group_two.py
      - name: Publish only verified group voice files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/group-two-audio-index.json assets/group-two-audio/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified group two recordings and measured word cues [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
