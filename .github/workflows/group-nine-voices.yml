name: Produce complete Group Nine voice library with real word boundaries
on:
  push:
    branches: [main]
    paths:
      - data/group-nine.json
      - scripts/render_group_nine_audio.py
      - .github/workflows/group-nine-voices.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-group-nine-voice-main
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech and duration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'edge-tts>=7,<8'
      - name: Record each new narration, scene, story and dialogue
        run: |
          set -o pipefail
          python scripts/render_group_nine_audio.py --concurrency 3 --retries 6 2>&1 | tee /tmp/g9-private-voices.log
      - name: Validate clips, source references and same-recording word cues
        run: python scripts/test_group_nine.py --require-audio
      - name: Publish only verified group voice files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/group-nine-audio-index.json assets/group-nine-audio/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified group nine recordings and measured word cues [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preserve failure trace for Group Nine diagnostics
        if: failure()
        run: |
          mkdir -p reports
          if [ -s "/tmp/g9-private-voices.log" ]; then
            tail -n 85 "/tmp/g9-private-voices.log" > reports/group-nine-private-voice-error.txt
          else
            echo "No recording or browser trace was produced; inspect earlier installation and validation steps." > reports/group-nine-private-voice-error.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/group-nine-private-voice-error.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Capture Group Nine CI failure details [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
