name: Verify eighth English feelings-opinions group
on:
  push:
    branches: [main]
    paths: ["group-eight.js", "data/group-eight.json", "data/group-eight-audio-index.json", "scripts/test_group_eight.py", "index.html", "app.js", "styles.css", ".github/workflows/verify-group-eight.yml"]
  pull_request:
    paths: ["group-eight.js", "data/group-eight.json", "data/group-eight-audio-index.json", "scripts/test_group_eight.py", "index.html", "app.js", "styles.css", ".github/workflows/verify-group-eight.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax and source validation
        run: |
          set -o pipefail
          npm run check
          node --check group-eight.js
          python scripts/test_group_eight.py 2>&1 | tee /tmp/g8-verify.log
      - name: Confirm group navigator is integrated and no shared API was replaced
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const app=fs.readFileSync('app.js','utf8'),html=fs.readFileSync('index.html','utf8');
          assert.match(app,/GROUP_EIGHT\?\.open/);
          assert.match(app,/GROUP_EIGHT\?\.stop/);
          assert.match(html,/data-view="group-eight"/);
          assert.match(html,/id="g8ChapterTabs"/);
          assert.match(html,/data-view="group-one"/);
          assert.match(html,/src="group-eight\.js"/);
          assert.match(html,/data-view="paths"/);
          assert.match(html,/data-view="learn"/);
          console.log("Navigation integration OK");
          JS

      - name: Summarize Group Eight verification
        run: |
          echo "✅ Group Eight curriculum, source links and JavaScript checks passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Voice files are verified by the separate mandatory recording workflow; this source check does not attest audio completeness." >> "$GITHUB_STEP_SUMMARY"
