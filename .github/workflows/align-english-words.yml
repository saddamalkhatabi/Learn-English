name: Align original Kokoro English recordings to words
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/align_recordings.py'
      - 'data/lessons.json'
      - 'data/stories.json'
      - 'assets/audio/**'
      - '.github/workflows/align-english-words.yml'
permissions:
  contents: write
concurrency:
  group: learn-english-acoustic-alignment
  cancel-in-progress: false
jobs:
  measured-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only acoustic alignment dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' 'torchaudio==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy<2' 'soundfile>=0.12' 'uroman>=1.3'
      - name: Measure each word against its final committed MP3
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TORCH_HOME: ${{ runner.temp }}/torch-acoustic-models
        run: python scripts/align_recordings.py
      - name: Validate exhaustive and monotonic same-recording timestamps
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          d=json.loads((root/'data/audio-word-cues.json').read_text())
          assert d['total_recordings']==96
          assert len(d['items'])==96
          for path,row in d['items'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==row['audio_sha256'],path
              assert row['text'].split() and len(row['cues'])==len(row['text'].split()),path
              assert all(c==[i,c[1],c[2]] and 0<=c[1]<c[2]<=row['duration_ms']+30
                         for i,c in enumerate(row['cues'])),path
              assert all(row['cues'][i-1][2]<=row['cues'][i][1]
                         for i in range(1,len(row['cues']))),path
          print('PASS: 96 source MP3 hashes and exact word index coverage')
          PY
      - name: Commit only measured timestamps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audio-word-cues.json
          if ! git diff --cached --quiet; then
            git commit -m "Add source-verified acoustic word timestamps [skip ci]"
            git push
          fi
