name: Align original Kokoro English recordings to words
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/align_recordings.py
      - data/lessons.json
      - data/stories.json
      - assets/audio/**
      - .github/workflows/align-english-words.yml
permissions:
  contents: write
concurrency:
  group: learn-english-acoustic-alignment
  cancel-in-progress: false
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        lesson: [this, have, got]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install smaller CPU English alignment model dependencies
        run: |
          python -m pip install --disable-pip-version-check --timeout 40 --retries 1 \
            'torch==2.6.0' 'torchaudio==2.6.0' \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --timeout 40 --retries 1 \
            'numpy<2' 'soundfile>=0.12'
      - name: Measure original audio word boundaries - ${{ matrix.lesson }}
        env:
          TORCH_HOME: ${{ runner.temp }}/torch-acoustic-models
        run: |
          python scripts/align_recordings.py \
            --lesson "${{ matrix.lesson }}" \
            --output "measured-${{ matrix.lesson }}.json"
      - name: Verify 32 recordings and cue ranges against MP3 SHA256
        run: |
          LESSON="${{ matrix.lesson }}" python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('.')
          data=json.loads((root/('measured-'+os.environ['LESSON']+'.json')).read_text())
          assert data['total_recordings']==32 and len(data['items'])==32
          for path,entry in data['items'].items():
              assert path.startswith('assets/audio/'+os.environ['LESSON']+'/')
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==entry['audio_sha256'],path
              assert len(entry['text'].split())==len(entry['cues']),path
              assert all(c[0]==i and 0<=c[1]<c[2]<=entry['duration_ms']+40
                         for i,c in enumerate(entry['cues'])),path
              assert all(entry['cues'][i-1][2]<=entry['cues'][i][1]
                         for i in range(1,len(entry['cues']))),path
          print('PASS: 32 source audio hashes and measured word cues')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: measured-cues-${{ matrix.lesson }}
          path: measured-${{ matrix.lesson }}.json
          retention-days: 30
  publish:
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: measured-cues-*
          path: cue-parts
          merge-multiple: true
      - name: Validate full set of 96 cues and build one file
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          items={}
          for lesson in ('this','have','got'):
              data=json.loads((root/f'cue-parts/measured-{lesson}.json').read_text())
              assert data['total_recordings']==32
              assert len(data['items'])==32
              for path,entry in data['items'].items():
                  assert path not in items
                  assert path.startswith('assets/audio/'+lesson+'/')
                  assert hashlib.sha256((root/path).read_bytes()).hexdigest()==entry['audio_sha256']
                  assert len(entry['cues'])==len(entry['text'].split())
                  items[path]=entry
          assert len(items)==96
          out={'schema':1,'generated_from':'96 original committed Kokoro MP3 recordings',
               'total_recordings':96,'items':items}
          (root/'data/audio-word-cues.json').write_text(json.dumps(
              out,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('PASS: 96 source recordings, verified cues for',sum(len(x['cues']) for x in items.values()),'words')
          PY
      - name: Commit verified measured cues to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audio-word-cues.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish measured same-MP3 English word boundaries [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
